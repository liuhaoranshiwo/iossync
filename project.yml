name: iOSSync
options:
  bundleIdPrefix: com.iossync
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  iOSSync:
    type: application
    platform: iOS
    sources:
      - path: iOSSync
    dependencies:
      - sdk: HealthKit.framework
      - sdk: CoreLocation.framework
      - sdk: CoreBluetooth.framework
    info:
      path: iOSSync/Info.plist
      properties:
        CFBundleDisplayName: iOSSync
        CFBundleShortVersionString: "3.16"
        CFBundleVersion: "39"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: 读取步数与心率，用于同步到小米手表。
        NSLocationWhenInUseUsageDescription: 获取当前位置，用于刷新手表上的天气。
        NSLocalNetworkUsageDescription: 连接同一 Wi-Fi 下的手表同步数据（自动发现，无需固定 IP）。
        NSBonjourServices:
          - _iossync._tcp
        NSBluetoothAlwaysUsageDescription: 通过蓝牙直连手表同步健康与位置数据。
        # 后台继续保持 BLE 连接（Wear OS 直连的唯一后台通道）
        UIBackgroundModes:
          - bluetooth-central
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: iOSSync/iOSSync.entitlements
      properties:
        com.apple.developer.healthkit: true
        # 巨魔特权：免弹窗直接授予本地网络与蓝牙权限（官方通道做不到）
        com.apple.private.tcc.allow:
          - kTCCServiceLocalNetwork
          - kTCCServiceBluetooth-always
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iossync.app
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        DEVELOPMENT_TEAM: ""
        ENABLE_BITCODE: "NO"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
