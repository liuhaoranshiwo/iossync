name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project iOSSync.xcodeproj \
            -scheme iOSSync \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES | tee build.log | tail -30

      - name: Fake-sign binary with ldid (keep HealthKit entitlement)
        run: |
          ldid -SiOSSync/iOSSync.entitlements build/Build/Products/Release-iphoneos/iOSSync.app/iOSSync
          ldid -e build/Build/Products/Release-iphoneos/iOSSync.app/iOSSync || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/iOSSync.app Payload/
          zip -qr iOSSync.ipa Payload
          ls -la iOSSync.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOSSync-ipa
          path: iOSSync.ipa
